# Dates fixed before fitting. Targets are PARDIG proxies, not independent radar.
checkpoint: runs/precipitation_year/model.pt
static_path: data/precipitation/terrain.zarr
region: [40.0, 53.0, -7.0, 11.0]
predictors: [tp, t2m, d2m, u10m, v10m, msl]
forecast_interval_hours: 6
members: 32
splits:
  fit: ['2021-01-15', '2021-02-15', '2021-03-15', '2021-04-15', '2021-05-15', '2021-06-15', '2021-07-15', '2021-08-15', '2021-09-15', '2021-10-15', '2021-11-15', '2021-12-15']
  selection: ['2023-01-15', '2023-04-15', '2023-07-15', '2023-10-15']
  test: ['2024-01-15', '2024-04-15', '2024-07-15', '2024-10-15']
thresholds_mm: [1.0, 2.0, 3.0, 5.0]
shape_range: [0.0, 0.45]
max_negative_fit_points: 200000
max_iterations: 120
regularization: 0.001
seed: 17
selection:
  objective: sum_twcrps_5_10_mm
  max_overall_crps_ratio: 1.05
