# Matched five-epoch fine-tune from the joint model; terrain is the ablation.
region: [40.0, 53.0, -7.0, 11.0]
predictors: [tp, t2m, d2m, u10m, v10m, msl]
forecast_interval_hours: 6
validation_start: '2020-10-02T01:00:00'
static_path: data/precipitation/terrain.zarr
evaluation_noise_seed: 2
model:
  base: 16
  depth: 3
  noise_factor: 8
  members: 4
  temporal_context: false
  architecture: joint
  sequence_hours: 12
  terrain: true
training:
  epochs: 5
  batch_windows: 1
  sequence_windows: 2
  temporal_weight: 0.15
  mean_loss_weight: 0.1
  learning_rate: 0.00005
  seed: 0
  paired_noise: true
  max_steps: null
  init_checkpoint: runs/precipitation_joint/model.pt
  selection: joint
